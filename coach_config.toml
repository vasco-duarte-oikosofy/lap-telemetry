# Coach LLM configuration
# API keys are NEVER stored here — only the name of the environment variable.
# Set the actual key in your shell: export ANTHROPIC_API_KEY=sk-...

[llm]
provider = "ollama"                          
model = "llama3"                              # your Ollama cloud model name
api_key_env = "OLLAMA_API_KEY"              # env var name (NOT the key itself)
temperature = 0.3
max_tokens = 100
base_url = "https://api.ollama.com/v1"     # Ollama cloud OpenAI-compatible endpoint
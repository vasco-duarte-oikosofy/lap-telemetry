<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lap Telemetry — Compare</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:         #0d1117;
  --surface:    #161b22;
  --surface2:   #1c2128;
  --border:     #30363d;
  --text:       #c9d1d9;
  --muted:      #8b949e;
  --accent:     #58a6ff;
  --session:    #4fc3f7;
  --ref:        #ff9800;
  --throttle:   #4caf50;
  --brake:      #f44336;
  --slip-fl:    #ce93d8;
  --slip-fr:    #80cbc4;
  --dt-pos:     #ef5350;
  --dt-neg:     #66bb6a;
  --error:      #f85149;
  --ok:         #3fb950;
  --sector-clr: #ffd54f;
}

html { font-size: 14px; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: ui-monospace, 'Cascadia Code', 'Fira Code', monospace;
  min-height: 100vh;
  padding: 20px 24px 40px;
}

h1 { font-size: 18px; font-weight: 600; color: var(--accent); margin-bottom: 18px; }

/* ── Loader panel ── */
.loader-panel {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 14px 16px;
  margin-bottom: 16px;
}
.loader-panel h2 { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin-bottom: 10px; }

.load-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.load-btn {
  background: var(--border);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 6px 14px;
  font-family: inherit;
  font-size: 12px;
  cursor: pointer;
  white-space: nowrap;
}
.load-btn:hover { background: #3a4049; }
#file-input { display: none; }

.colour-controls {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-left: auto;
  font-size: 11px;
  color: var(--muted);
}
.colour-controls label { display: inline-flex; align-items: center; gap: 5px; }
.colour-controls input[type="color"] {
  width: 22px;
  height: 22px;
  border: 1px solid var(--border);
  border-radius: 3px;
  background: none;
  padding: 0;
  cursor: pointer;
}
.colour-controls .load-btn { padding: 4px 10px; font-size: 11px; }

.session-list { display: flex; flex-direction: column; gap: 6px; }
.session-entry {
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 6px 10px;
  font-size: 12px;
}
.session-entry .fname { flex: 1; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.session-entry .remove-btn { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 14px; padding: 0 2px; }
.session-entry .remove-btn:hover { color: var(--error); }

/* ── Pickers ── */
.pickers-row {
  display: grid;
  grid-template-columns: 1fr 1fr auto;
  gap: 12px;
  align-items: end;
  margin-bottom: 16px;
}
.picker-group label { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin-bottom: 5px; }
select {
  width: 100%;
  background: var(--surface);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 7px 10px;
  font-family: inherit;
  font-size: 12px;
  cursor: pointer;
}
select:disabled { opacity: 0.4; cursor: default; }
optgroup { color: var(--muted); font-style: normal; }

.compare-btn {
  background: var(--accent);
  color: #000;
  border: none;
  border-radius: 4px;
  padding: 8px 20px;
  font-family: inherit;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  white-space: nowrap;
  align-self: end;
}
.compare-btn:disabled { opacity: 0.35; cursor: default; }
.compare-btn:not(:disabled):hover { filter: brightness(1.15); }

/* ── Status badge ── */
.badge {
  font-size: 10px;
  padding: 2px 7px;
  border-radius: 10px;
  background: var(--border);
  color: var(--muted);
  white-space: nowrap;
}
.badge.ok      { background: #1a3a1a; color: var(--ok); }
.badge.err     { background: #2a1a1a; color: var(--error); }
.badge.loading { background: #1a2a3a; color: var(--accent); }

/* ── Legend ── */
.legend {
  display: none;
  gap: 20px;
  margin-bottom: 8px;
  font-size: 11px;
  color: var(--muted);
  flex-wrap: wrap;
}
.legend.visible { display: flex; }
.legend-item { display: flex; align-items: center; gap: 6px; }
.legend-swatch { width: 20px; height: 3px; border-radius: 1px; }
.legend-swatch.dashed {
  background: repeating-linear-gradient(90deg, currentColor 0 6px, transparent 6px 9px);
}

/* ── Plots container (Phase 00-layout: full-width, below map) ── */
#plots-container {
  display: block;
  width: 100%;
}

/* ── Plot area ── */
#plot-area {
  position: relative;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 12px 16px;
  cursor: crosshair;
  overflow: hidden;
  flex: 1;
}

/* ── Circuit map panel (Phase 00-layout: promoted to top, 50% width, centered) ── */
#circuit-map-panel {
  /* Desktop: 50% width, centered */
  width: 50%;
  margin: 0 auto;
  /* Height: min(60vh, 720px) with 420px floor */
  height: clamp(420px, 60vh, 720px);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  position: relative;
}
@media (max-width: 1023px) {
  #circuit-map-panel {
    /* Mobile: full-width, stacked */
    width: 100%;
  }
}
#circuit-map-panel .panel-label {
  margin-bottom: 0;
}
#circuit-map-panel .map-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 4px;
}
.map-controls {
  display: flex;
  align-items: center;
  gap: 6px;
}
.map-mode-select {
  width: auto;
  font-size: 11px;
  padding: 3px 6px;
}
.feature-flag-menu {
  max-width: 190px;
}
#circuit-map-svg {
  width: 100%;
  height: 100%;
  min-height: 0;
  background: rgba(0,0,0,0.2);
  border-radius: 4px;
}
.static-track-boundary {
  fill: none;
  stroke: rgba(210, 210, 210, 0.28);
  stroke-width: 1;
  stroke-linejoin: round;
}
.static-track-centerline {
  fill: none;
  stroke: rgba(210, 210, 210, 0.18);
  stroke-width: 0.8;
  stroke-dasharray: 3 4;
  stroke-linejoin: round;
}
#track-heatmap-canvas {
  width: 100%;
  height: 100%;
  min-height: 0;
  background: rgba(0,0,0,0.2);
  border-radius: 4px;
  cursor: grab;
  touch-action: none;
}
.map-zoom-indicator {
  position: absolute;
  bottom: 8px;
  right: 8px;
  font-size: 11px;
  color: var(--muted);
  background: rgba(0,0,0,0.5);
  padding: 2px 6px;
  border-radius: 3px;
  pointer-events: none;
  user-select: none;
  font-variant-numeric: tabular-nums;
}

/* Phase 03 — Map legend overlays */
.map-legend-overlay {
  position: absolute;
  top: 48px;
  pointer-events: none;
  user-select: none;
  z-index: 5;
}
.map-lap-legend {
  left: 8px;
  display: flex;
  flex-direction: column;
  gap: 4px;
  background: rgba(13,17,23,0.85);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 6px 8px;
}
.map-lap-legend .legend-row {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  color: var(--text);
}
.map-lap-legend .legend-swatch {
  width: 12px;
  height: 12px;
  border-radius: 2px;
  flex-shrink: 0;
}
.map-lap-legend .legend-label {
  white-space: nowrap;
}
.map-ramp-legend {
  right: 8px;
  display: flex;
  align-items: center;
  gap: 6px;
  background: rgba(13,17,23,0.85);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 4px 8px;
}
.map-ramp-legend .ramp-label {
  font-size: 10px;
  color: var(--muted);
  white-space: nowrap;
}
.map-ramp-legend .ramp-wrap {
  width: 160px;
  height: 16px;
  border-radius: 2px;
  overflow: hidden;
  flex-shrink: 0;
}
.map-ramp-legend .ramp-wrap canvas {
  display: block;
  width: 100%;
  height: 100%;
}
.map-legend {
  font-size: 10px;
  color: var(--muted);
  display: flex;
  align-items: center;
  gap: 6px;
  height: 14px;
}
.map-legend-bar {
  flex: 1;
  height: 8px;
  border-radius: 2px;
}

/* ── Zoom selection rect ── */
.zoom-selection-rect {
  position: absolute;
  top: 0;
  height: 100%;
  background: rgba(88, 166, 255, 0.15);
  border-left: 1px solid var(--accent);
  border-right: 1px solid var(--accent);
  pointer-events: none;
  z-index: 5;
  display: none;
}
.zoom-selection-rect.active { display: block; }

.placeholder {
  display: flex;
  align-items: center;
  justify-content: center;
  height: 280px;
  color: var(--muted);
  font-size: 13px;
}

/* Individual panels */
.panel-wrap { margin-bottom: 8px; }
.panel-wrap:last-child { margin-bottom: 0; }
.panel-label {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  color: var(--muted);
  margin-bottom: 2px;
}
.panel-svg { display: block; width: 100%; overflow: visible; }

/* ── Apex metrics table ── */
.apex-metrics-note { color: var(--muted); font-size: 11px; margin-bottom: 8px; }
.apex-metrics-table { width: 100%; border-collapse: collapse; table-layout: fixed; font-size: 12px; }
.apex-metrics-table th, .apex-metrics-table td { border-top: 1px solid var(--border); padding: 6px 8px; text-align: left; vertical-align: top; font-variant-numeric: tabular-nums; }
.apex-metrics-table th { color: var(--muted); font-size: 10px; font-weight: 600; letter-spacing: 0.5px; text-transform: uppercase; }
.apex-metrics-empty { color: var(--muted); font-size: 12px; }

/* SVG text styles (applied via inline attributes) */

/* ── Cursor overlay ── */
#cursor-overlay { position: absolute; inset: 0; pointer-events: none; z-index: 10; }
.cursor-line { position: absolute; top: 0; bottom: 0; width: 1px; background: rgba(255,255,255,0.3); transform: translateX(-9999px); pointer-events: none; }

/* ── Tooltip ── */
#tooltip { position: absolute; background: rgba(13,17,23,0.92); border: 1px solid var(--border); border-radius: 4px; padding: 8px 10px; font-size: 11px; color: var(--text); pointer-events: none; z-index: 20; display: none; max-width: 240px; white-space: pre; line-height: 1.6; }

/* Phase 04 — Hover readout */
.map-hover-readout { position: absolute; background: rgba(13,17,23,0.92); border: 1px solid var(--border); border-radius: 4px; padding: 6px 8px; font-size: 11px; color: var(--text); pointer-events: none; user-select: none; z-index: 15; display: none; font-family: ui-monospace, 'Cascadia Code', 'Fira Code', monospace; line-height: 1.5; }
.readout-dist { font-size: 10px; color: var(--muted); margin-bottom: 4px; font-variant-numeric: tabular-nums; }
.readout-row { font-size: 11px; white-space: nowrap; }
.readout-row span { font-weight: 600; }

/* ── Error ── */
.error-msg { color: var(--error); font-size: 12px; margin-top: 10px; display: none; }
.error-msg.visible { display: block; }

/* ── Drag reorder (F9) ── */
.drag-handle { cursor: grab; opacity: 0.4; margin-right: 6px; user-select: none; font-size: 12px; }
.panel-wrap.drag-over { border-top: 2px solid var(--accent); margin-top: -2px; }

</style>
</head>
<body>

<h1>Lap Telemetry — Compare</h1>

<!-- Loader panel -->
<div class="loader-panel">
  <h2>Sessions</h2>
  <div class="load-row">
    <button class="load-btn" id="load-btn">+ Load parquet…</button>
    <input type="file" id="file-input" accept=".parquet,.json,.csv" multiple>
    <span id="load-status" class="badge">no files loaded</span>
    <span class="colour-controls">
      <label>Session <input type="color" id="colour-session" value="#4fc3f7"></label>
      <label>Ref <input type="color" id="colour-ref" value="#ff9800"></label>
      <button class="load-btn" id="colour-reset" title="Reset lap colours">reset</button>
      <button class="load-btn" id="order-reset" title="Reset panel order">⟳ panels</button>
    </span>
  </div>
  <div class="session-list" id="session-list"></div>
</div>

<!-- Pickers -->
<div class="pickers-row">
  <div class="picker-group">
    <label>Session lap</label>
    <select id="session-picker" disabled>
      <option value="">— load a session file —</option>
    </select>
  </div>
  <div class="picker-group">
    <label>Reference lap</label>
    <select id="ref-picker" disabled>
      <option value="">— load a session file —</option>
    </select>
  </div>
  <button class="compare-btn" id="compare-btn" disabled>Compare</button>
</div>

<!-- Legend -->
<div class="legend" id="legend">
  <div class="legend-item">
    <div class="legend-swatch" style="background:var(--session)"></div>
    <span id="legend-session">Session</span>
  </div>
  <div class="legend-item">
    <div class="legend-swatch dashed" style="color:var(--ref)"></div>
    <span id="legend-ref">Reference</span>
  </div>
</div>

<div id="apex-metrics-panel" style="display: none; background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 12px 16px; margin-bottom: 16px;"></div>

<!-- Circuit map panel (Phase 00-layout: promoted to top, 50% width) -->
<div id="circuit-map-panel" style="display: none;">
  <div class="map-header">
    <div class="panel-label">Circuit Map</div>
    <div class="map-controls">
      <select id="map-mode" class="map-mode-select">
        <option value="outline">outline</option>
        <option value="speed">speed</option>
        <option value="brake">brake</option>
        <option value="throttle">throttle</option>
      </select>
      <select id="feature-flag-menu" class="map-mode-select feature-flag-menu" aria-label="Feature flags">
        <option value="">feature flags</option>
      </select>
    </div>
  </div>
  <svg id="circuit-map-svg" viewBox="0 0 250 250" data-panel-id="circuit-map" preserveAspectRatio="xMidYMid meet">
    <g id="static-track-outline"></g>
    <g id="track-segments"></g>
    <polyline id="track-outline" fill="none" stroke="var(--text)" stroke-width="1.5" stroke-linejoin="round"/>
    <polyline id="zoom-arc" fill="none" stroke="var(--sector-clr)" stroke-width="2.5" stroke-linejoin="round" style="display: none;"/>
    <circle id="cursor-dot" r="4" fill="var(--accent)" style="display: none;"/>
  </svg>
  <canvas id="track-heatmap-canvas" style="display: none;"></canvas>
  <div id="map-legend" class="map-legend"></div>
</div>

<!-- Plots container -->
<div id="plots-container">
  <!-- Plot area -->
  <div id="plot-area">
    <div class="placeholder" id="placeholder">Load sessions and pick two laps to compare</div>
    <div id="panels"></div>
    <div class="zoom-selection-rect" id="zoom-selection-rect"></div>
    <div id="cursor-overlay">
      <div class="cursor-line" id="cursor-line"></div>
    </div>
    <div id="tooltip"></div>
  </div>
</div>

<p class="error-msg" id="error-msg"></p>

  ).join("");

  svg += `<line x1="${scaledLeft}" y1="${PAD.top + plotH}" x2="${scaledLeft + scaledPlotW}" y2="${PAD.top + plotH}" stroke="var(--border)" stroke-width="1"/>`;
  svg += xTicks.map((d) => {

  }).join("");
  svg += `<text x="${scaledLeft + scaledPlotW / 2}" y="${H - 2}" text-anchor="middle" fill="var(--muted)" font-size="9" font-family="monospace">Distance (m)</text>`;

    const t = [], step = def.yStep;

  })();
  svg += yTicks.map(
    (y) => `<text x="${scaledLeft - 5}" y="${toY(y) + 3}" text-anchor="end" fill="var(--muted)" font-size="9" font-family="monospace">${y > 0 ? "+" : ""}${y}</text>`
  ).join("");
  svg += yTicks.map(
    (y) => `<line x1="${scaledLeft}" y1="${toY(y)}" x2="${scaledLeft + scaledPlotW}" y2="${toY(y)}" stroke="var(--border)" stroke-width="0.4" stroke-dasharray="3 3"/>`
  ).join("");
  const zeroY = toY(Math.max(yMin, Math.min(yMax, 0)));
  svg += `<polyline points="${scaledLeft},${zeroY} ${scaledLeft + scaledPlotW},${zeroY}" fill="none" stroke="var(--ref)" stroke-width="0.9" stroke-dasharray="6 3" clip-path="url(#clip-dt)"/>`;

  svg += `<polyline points="${ptsArr.join(" ")}" fill="none" stroke="var(--session)" stroke-width="0.9" stroke-linejoin="round" clip-path="url(#clip-dt)"/>`;
  const dtAt = (dist) => {

  const fmtMs = (v) => `${v >= 0 ? "+" : ""}${v.toFixed(0)} ms`;

      if (dist == null || dist < 0 || dist > maxDist) continue;
      const x = toX(dist);
      svg += `<line x1="${x}" y1="${PAD.top}" x2="${x}" y2="${PAD.top + plotH}" stroke="var(--sector-clr)" stroke-width="1" stroke-dasharray="4 4" clip-path="url(#clip-dt)"/>`;
      svg += `<text x="${x + 3}" y="${PAD.top + 11}" fill="var(--sector-clr)" font-size="9" font-family="monospace">${label}</text>`;
      const v = dtAt(dist);
      if (v != null && isFinite(v)) {

  if (isFinite(lastDt)) {
    svg += `<text x="${scaledLeft + scaledPlotW - 4}" y="${PAD.top + 11}" text-anchor="end" fill="${dtColor(lastDt)}" font-size="10" font-family="monospace" font-weight="600">end ${fmtMs(lastDt)}</text>`;
  }
  return `<svg class="panel-svg" viewBox="0 0 ${containerWidth} ${H}" data-panel-id="dt" preserveAspectRatio="none">${svg}</svg>`;
}

// product/web/js/dataTransforms.js
function parseDeltabestCsv(text) {
  const dist = [], time = [];
  for (const rawLine of text.split(/\r?\n/)) {
    const line = rawLine.trim();
    if (!line || line.startsWith("#")) continue;
    const parts = line.split(",");
    if (parts.length < 2) continue;
    const d = parseFloat(parts[0]);
    const t = parseFloat(parts[1]);
    if (!Number.isFinite(d) || !Number.isFinite(t)) continue;
    dist.push(d);
    time.push(t);
  }
  if (dist.length < 10) {
    throw new Error(`only ${dist.length} valid rows`);
  }
  const n = dist.length;
  const speedRaw = new Float32Array(n);
  for (let i = 1; i < n; i++) {
    const dd = dist[i] - dist[i - 1];
    const dt = Math.max(time[i] - time[i - 1], 1e-3);
    speedRaw[i] = dd / dt * 3.6;
  }
  speedRaw[0] = speedRaw[1];
  const speed = new Float32Array(n);
  for (let i = 0; i < n; i++) {
    const a = speedRaw[Math.max(0, i - 1)];
    const b = speedRaw[i];
    const c = speedRaw[Math.min(n - 1, i + 1)];
    speed[i] = (a + b + c) / 3;
  }
  const lapNum = new Int32Array(n);
  const lapDist = new Float32Array(dist);
  const lapTime = new Float32Array(time);
  return {
    data: {
      lap_number: lapNum,
      lap_time_s: lapTime,
      lap_distance_m: lapDist,
      speed_kph: speed,
      throttle_norm: [],
      brake_norm: [],
      engine_rpm: [],
      gear: [],
      steering_norm: [],
      slip_angle_fl_deg: [],
      slip_angle_fr_deg: [],
      last_sector_1_s: [],
      last_sector_2_s: [],
      pos_x_m: [],
      pos_z_m: [],
      abs_active: [],
      tc_active: []
    },
    segments: [{ lapNum: 0, start: 0, end: n }],
    rowCount: n
  };
}
function buildDeltabestSidecar(rowCount) {
  return {
    schema_version: "tinypedal-deltabest",
    sim: "tinypedal",
    track: "unknown",
    vehicle_name: "TinyPedal deltabest",
    setup_file_guess: null,

    in_progress: false
  };
}

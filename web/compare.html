<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lap Telemetry — Compare</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:         #0d1117;
    --surface:    #161b22;
    --surface2:   #1c2128;
    --border:     #30363d;
    --text:       #c9d1d9;
    --muted:      #8b949e;
    --accent:     #58a6ff;
    --session:    #4fc3f7;
    --ref:        #ff9800;
    --throttle:   #4caf50;
    --brake:      #f44336;
    --slip-fl:    #ce93d8;
    --slip-fr:    #80cbc4;
    --dt-pos:     #ef5350;
    --dt-neg:     #66bb6a;
    --error:      #f85149;
    --ok:         #3fb950;
    --sector-clr: #ffd54f;
  }

  html { font-size: 14px; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: ui-monospace, 'Cascadia Code', 'Fira Code', monospace;
    min-height: 100vh;
    padding: 20px 24px 40px;
  }

  h1 { font-size: 18px; font-weight: 600; color: var(--accent); margin-bottom: 18px; }

  /* ── Loader panel ── */
  .loader-panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 14px 16px;
    margin-bottom: 16px;
  }
  .loader-panel h2 { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin-bottom: 10px; }

  .load-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .load-btn {
    background: var(--border);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 6px 14px;
    font-family: inherit;
    font-size: 12px;
    cursor: pointer;
    white-space: nowrap;
  }
  .load-btn:hover { background: #3a4049; }
  #file-input { display: none; }

  .session-list { display: flex; flex-direction: column; gap: 6px; }
  .session-entry {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 6px 10px;
    font-size: 12px;
  }
  .session-entry .fname { flex: 1; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .session-entry .remove-btn { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 14px; padding: 0 2px; }
  .session-entry .remove-btn:hover { color: var(--error); }

  /* ── Pickers ── */
  .pickers-row {
    display: grid;
    grid-template-columns: 1fr 1fr auto;
    gap: 12px;
    align-items: end;
    margin-bottom: 16px;
  }
  .picker-group label { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin-bottom: 5px; }
  select {
    width: 100%;
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 7px 10px;
    font-family: inherit;
    font-size: 12px;
    cursor: pointer;
  }
  select:disabled { opacity: 0.4; cursor: default; }
  optgroup { color: var(--muted); font-style: normal; }

  .compare-btn {
    background: var(--accent);
    color: #000;
    border: none;
    border-radius: 4px;
    padding: 8px 20px;
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    align-self: end;
  }
  .compare-btn:disabled { opacity: 0.35; cursor: default; }
  .compare-btn:not(:disabled):hover { filter: brightness(1.15); }

  /* ── Status badge ── */
  .badge {
    font-size: 10px;
    padding: 2px 7px;
    border-radius: 10px;
    background: var(--border);
    color: var(--muted);
    white-space: nowrap;
  }
  .badge.ok      { background: #1a3a1a; color: var(--ok); }
  .badge.err     { background: #2a1a1a; color: var(--error); }
  .badge.loading { background: #1a2a3a; color: var(--accent); }

  /* ── Legend ── */
  .legend {
    display: none;
    gap: 20px;
    margin-bottom: 8px;
    font-size: 11px;
    color: var(--muted);
    flex-wrap: wrap;
  }
  .legend.visible { display: flex; }
  .legend-item { display: flex; align-items: center; gap: 6px; }
  .legend-swatch { width: 20px; height: 3px; border-radius: 1px; }
  .legend-swatch.dashed {
    background: repeating-linear-gradient(90deg, currentColor 0 6px, transparent 6px 9px);
  }

  /* ── Plots container ── */
  #plots-container {
    display: flex;
    gap: 12px;
    align-items: flex-start;
  }

  /* ── Plot area ── */
  #plot-area {
    position: relative;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 12px 16px;
    cursor: crosshair;
    overflow: hidden;
    flex: 1;
  }

  /* ── Circuit map panel ── */
  #circuit-map-panel {
    flex: 0 0 250px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  #circuit-map-panel .panel-label {
    margin-bottom: 0;
  }
  #circuit-map-panel .map-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 4px;
  }
  .map-mode-select {
    width: auto;
    font-size: 11px;
    padding: 3px 6px;
  }
  #circuit-map-svg {
    width: 100%;
    height: auto;
    min-height: 250px;
    background: rgba(0,0,0,0.2);
    border-radius: 4px;
  }
  .map-legend {
    font-size: 10px;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 6px;
    height: 14px;
  }
  .map-legend-bar {
    flex: 1;
    height: 8px;
    border-radius: 2px;
  }

  /* ── Zoom selection rect ── */
  .zoom-selection-rect {
    position: absolute;
    top: 0;
    height: 100%;
    background: rgba(88, 166, 255, 0.15);
    border-left: 1px solid var(--accent);
    border-right: 1px solid var(--accent);
    pointer-events: none;
    z-index: 5;
    display: none;
  }
  .zoom-selection-rect.active { display: block; }

  .placeholder {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 280px;
    color: var(--muted);
    font-size: 13px;
  }

  /* Individual panels */
  .panel-wrap { margin-bottom: 8px; }
  .panel-wrap:last-child { margin-bottom: 0; }
  .panel-label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    color: var(--muted);
    margin-bottom: 2px;
  }
  .panel-svg { display: block; width: 100%; overflow: visible; }

  /* SVG text styles (applied via inline attributes) */

  /* ── Cursor overlay ── */
  #cursor-overlay {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 10;
  }
  .cursor-line {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 1px;
    background: rgba(255,255,255,0.3);
    transform: translateX(-9999px);
    pointer-events: none;
  }

  /* ── Tooltip ── */
  #tooltip {
    position: absolute;
    background: rgba(13,17,23,0.92);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 8px 10px;
    font-size: 11px;
    color: var(--text);
    pointer-events: none;
    z-index: 20;
    display: none;
    max-width: 240px;
    white-space: pre;
    line-height: 1.6;
  }

  /* ── Error ── */
  .error-msg { color: var(--error); font-size: 12px; margin-top: 10px; display: none; }
  .error-msg.visible { display: block; }
</style>
</head>
<body>

<h1>Lap Telemetry — Compare</h1>

<!-- Loader panel -->
<div class="loader-panel">
  <h2>Sessions</h2>
  <div class="load-row">
    <button class="load-btn" id="load-btn">+ Load parquet…</button>
    <input type="file" id="file-input" accept=".parquet,.json" multiple>
    <span id="load-status" class="badge">no files loaded</span>
  </div>
  <div class="session-list" id="session-list"></div>
</div>

<!-- Pickers -->
<div class="pickers-row">
  <div class="picker-group">
    <label>Session lap</label>
    <select id="session-picker" disabled>
      <option value="">— load a session file —</option>
    </select>
  </div>
  <div class="picker-group">
    <label>Reference lap</label>
    <select id="ref-picker" disabled>
      <option value="">— load a session file —</option>
    </select>
  </div>
  <button class="compare-btn" id="compare-btn" disabled>Compare</button>
</div>

<!-- Legend -->
<div class="legend" id="legend">
  <div class="legend-item">
    <div class="legend-swatch" style="background:var(--session)"></div>
    <span id="legend-session">Session</span>
  </div>
  <div class="legend-item">
    <div class="legend-swatch dashed" style="color:var(--ref)"></div>
    <span id="legend-ref">Reference</span>
  </div>
</div>

<!-- Plots container -->
<div id="plots-container">
  <!-- Plot area -->
  <div id="plot-area">
    <div class="placeholder" id="placeholder">Load sessions and pick two laps to compare</div>
    <div id="panels"></div>
    <div class="zoom-selection-rect" id="zoom-selection-rect"></div>
    <div id="cursor-overlay">
      <div class="cursor-line" id="cursor-line"></div>
    </div>
    <div id="tooltip"></div>
  </div>

  <!-- Circuit map panel -->
  <div id="circuit-map-panel" style="display: none;">
    <div class="map-header">
      <div class="panel-label">Circuit Map</div>
      <select id="map-mode" class="map-mode-select">
        <option value="outline">outline</option>
        <option value="speed">speed</option>
        <option value="brake">brake</option>
        <option value="throttle">throttle</option>
      </select>
    </div>
    <svg id="circuit-map-svg" viewBox="0 0 250 250" data-panel-id="circuit-map">
      <g id="track-segments"></g>
      <polyline id="track-outline" fill="none" stroke="var(--text)" stroke-width="1.5" stroke-linejoin="round"/>
      <polyline id="zoom-arc" fill="none" stroke="var(--sector-clr)" stroke-width="2.5" stroke-linejoin="round" style="display: none;"/>
      <circle id="cursor-dot" r="4" fill="var(--accent)" style="display: none;"/>
    </svg>
    <div id="map-legend" class="map-legend"></div>
  </div>
</div>

<p class="error-msg" id="error-msg"></p>

<script type="module">
// ── CDN imports ────────────────────────────────────────────────────────────
import { parquetRead, parquetMetadataAsync } from 'https://cdn.jsdelivr.net/npm/hyparquet@1/+esm';
import { compressors } from 'https://cdn.jsdelivr.net/npm/hyparquet-compressors@1/+esm';

// ── Constants ────────────────────────────────────────────────────────────────
const COLUMNS = [
  'lap_number', 'lap_time_s', 'lap_distance_m', 'speed_kph',
  'throttle_norm', 'brake_norm', 'engine_rpm', 'gear',
  'steering_norm', 'slip_angle_fl_deg', 'slip_angle_fr_deg',
  'last_sector_1_s', 'last_sector_2_s',
  'pos_x_m', 'pos_z_m',
];

// SVG layout constants
const SVG_W   = 900;
const PAD     = { top: 6, right: 20, bottom: 24, left: 58 };
const PLOT_W  = SVG_W - PAD.left - PAD.right;

// Circuit map constants
const MAP_SIZE = 250;
const MAP_PAD  = 20;

// Panel definitions: { id, label, height, channels, yFixed, yStep, zeroline }
const PANEL_DEFS = [
  { id: 'speed',    label: 'Speed (km/h)',         height: 140,
    channels: [
      { col: 'speed_kph', trace: 'session', color: 'var(--session)', dash: false },
      { col: 'speed_kph', trace: 'ref',     color: 'var(--ref)',     dash: true  },
    ],
    yFixed: null, yStep: 50, zeroline: false },

  { id: 'throttle', label: 'Throttle',               height: 60,
    channels: [
      { col: 'throttle_norm', trace: 'session', color: 'var(--session)', dash: false },
      { col: 'throttle_norm', trace: 'ref',     color: 'var(--ref)',     dash: true  },
    ],
    yFixed: [0, 1], yStep: 0.5, zeroline: false },

  { id: 'brake', label: 'Brake',                     height: 60,
    channels: [
      { col: 'brake_norm', trace: 'session', color: 'var(--session)', dash: false },
      { col: 'brake_norm', trace: 'ref',     color: 'var(--ref)',     dash: true  },
    ],
    yFixed: [0, 1], yStep: 0.5, zeroline: false },

  { id: 'rpm', label: 'RPM',                         height: 80,
    channels: [
      { col: 'engine_rpm', trace: 'session', color: 'var(--session)', dash: false },
      { col: 'engine_rpm', trace: 'ref',     color: 'var(--ref)',     dash: true  },
    ],
    yFixed: null, yStep: 2000, zeroline: false },

  { id: 'gear', label: 'Gear',                        height: 60,
    channels: [
      { col: 'gear', trace: 'session', color: 'var(--session)', dash: false, step: true },
      { col: 'gear', trace: 'ref',     color: 'var(--ref)',     dash: true,  step: true },
    ],
    yFixed: null, yStep: 1, zeroline: false },

  { id: 'steering', label: 'Steering',               height: 80,
    channels: [
      { col: 'steering_norm', trace: 'session', color: 'var(--session)', dash: false },
      { col: 'steering_norm', trace: 'ref',     color: 'var(--ref)',     dash: true  },
    ],
    yFixed: [-1, 1], yStep: 0.5, zeroline: true },

  { id: 'slip', label: 'Slip angle FL / FR (deg)',   height: 80,
    channels: [
      { col: 'slip_angle_fl_deg', trace: 'session', color: 'var(--slip-fl)', dash: false },
      { col: 'slip_angle_fl_deg', trace: 'ref',     color: 'var(--slip-fl)', dash: true  },
      { col: 'slip_angle_fr_deg', trace: 'session', color: 'var(--slip-fr)', dash: false },
      { col: 'slip_angle_fr_deg', trace: 'ref',     color: 'var(--slip-fr)', dash: true  },
    ],
    yFixed: null, yStep: 2, zeroline: false },

  { id: 'dt', label: 'Δt (ms, +session slower)',    height: 100,
    channels: null,  // special: computed from speed traces
    yFixed: null, yStep: 100, zeroline: true },
];

// ── Session store ─────────────────────────────────────────────────────────────
// Map from storeKey → { fileName, data: {col: Array}, segments, hasSlip, hasSectors }
const store = new Map();

function storeKey(file) { return `${file.name}::${file.size}`; }

// ── Parquet loading ───────────────────────────────────────────────────────────

function fileToAsyncBuffer(file) {
  return {
    byteLength: file.size,
    slice: async (start, end) => {
      return await file.slice(start, end).arrayBuffer();
    },
  };
}

async function readColumns(file, columns) {
  const result = Object.fromEntries(columns.map(c => [c, []]));
  const asyncBuffer = fileToAsyncBuffer(file);

  // Discover which requested columns actually exist in this file
  const meta = await parquetMetadataAsync(asyncBuffer);
  const schemaNames = new Set(
    meta.schema.flatMap(s => s.name ? [s.name] : [])
  );
  const availableCols = columns.filter(c => schemaNames.has(c));
  const missingCols   = columns.filter(c => !schemaNames.has(c));
  if (missingCols.length) {
    console.log(`readColumns: columns absent in schema: ${missingCols.join(', ')}`);
  }

  // hyparquet v1 onChunk: called once per column (or per column per row-group)
  // chunk = { columnName, columnData: TypedArray, rowStart, rowEnd }
  await parquetRead({
    file: fileToAsyncBuffer(file),
    compressors,
    columns: availableCols,
    onChunk({ columnName, columnData }) {
      if (Object.prototype.hasOwnProperty.call(result, columnName)) {
        for (let i = 0; i < columnData.length; i++) {
          result[columnName].push(columnData[i]);
        }
      }
    },
  });

  return { data: result, missingCols };
}

// ── Segment builder ───────────────────────────────────────────────────────────

function buildSegments(lapNumbers) {
  if (!lapNumbers.length) return [];
  const segs = [];
  let prev = lapNumbers[0], start = 0;
  for (let i = 1; i < lapNumbers.length; i++) {
    if (lapNumbers[i] !== prev) {
      segs.push({ lapNum: prev, start, end: i });
      prev = lapNumbers[i];
      start = i;
    }
  }
  segs.push({ lapNum: prev, start, end: lapNumbers.length });
  return segs;
}

// ── Resampler ─────────────────────────────────────────────────────────────────

function interpAt(xs, ys, x) {
  if (x <= xs[0]) return ys[0];
  if (x >= xs[xs.length - 1]) return ys[ys.length - 1];
  let lo = 0, hi = xs.length - 1;
  while (hi - lo > 1) {
    const mid = (lo + hi) >> 1;
    if (xs[mid] <= x) lo = mid; else hi = mid;
  }
  if (xs[hi] === xs[lo]) return ys[lo];
  const t = (x - xs[lo]) / (xs[hi] - xs[lo]);
  return ys[lo] + t * (ys[hi] - ys[lo]);
}

function resample(distances, values, maxDist) {
  const n = distances.length;
  if (!n) return new Float64Array(maxDist + 1);
  // Sort by distance; stable tie-break by frame index preserves time order within equal-distance clusters
  const idx = Array.from({ length: n }, (_, i) => i);
  idx.sort((a, b) => (distances[a] - distances[b]) || (a - b));
  const xs = idx.map(i => distances[i]);
  const ys = idx.map(i => values[i]);
  const bins = new Float64Array(maxDist + 1);
  for (let bin = 0; bin <= maxDist; bin++) bins[bin] = interpAt(xs, ys, bin);
  return bins;
}

// ── Δt computation ────────────────────────────────────────────────────────────

function computeDeltaT(sessionSpeed, refSpeed) {
  const len = Math.min(sessionSpeed.length, refSpeed.length);
  const dt = new Float64Array(len);
  let cumDt = 0;
  for (let i = 0; i < len; i++) {
    const vs = Math.max(sessionSpeed[i] / 3.6, 0.3); // m/s, guard zero
    const vr = Math.max(refSpeed[i] / 3.6, 0.3);
    // Time to travel 1 m at each speed (seconds), diff in ms
    cumDt += (1 / vs - 1 / vr) * 1000;
    dt[i] = cumDt;
  }
  return dt;
}

// ── Sector distance finder ────────────────────────────────────────────────────

function deriveSectorDistances(entry, segIdx) {
  const segs = entry.segments;
  const seg  = segs[segIdx];
  if (!entry.data.last_sector_1_s || !entry.data.last_sector_2_s) return null;
  if (segIdx >= segs.length - 1) return null; // no next segment

  const nextSeg = segs[segIdx + 1];
  const s1col  = entry.data.last_sector_1_s;
  const s2col  = entry.data.last_sector_2_s;

  // Walk up to 25 frames into next segment for settled sector values (O1/O2)
  const walkEnd = Math.min(nextSeg.start + 25, nextSeg.end);
  let s1 = NaN, cumS2 = NaN;
  for (let fi = nextSeg.start; fi < walkEnd; fi++) {
    const _s1 = s1col[fi], _cs2 = s2col[fi];
    if (!isNaN(_s1) && !isNaN(_cs2) && _s1 > 0 && _cs2 > _s1) {
      s1 = _s1; cumS2 = _cs2;
      break;
    }
  }
  if (isNaN(s1)) return null;

  // Convert split times to distances using lap_time_s within this segment
  const lapT   = entry.data.lap_time_s;
  const lapD   = entry.data.lap_distance_m;
  let d1 = null, d2 = null;
  let prev = seg.start;
  for (let fi = seg.start; fi < seg.end; fi++) {
    if (d1 === null && lapT[fi] >= s1) {
      // Interpolate
      const t0 = lapT[prev], t1 = lapT[fi];
      const d0 = lapD[prev], d1v = lapD[fi];
      const frac = (t0 === t1) ? 0 : (s1 - t0) / (t1 - t0);
      d1 = d0 + frac * (d1v - d0);
    }
    if (d2 === null && lapT[fi] >= cumS2) {
      const t0 = lapT[prev], t1 = lapT[fi];
      const d0 = lapD[prev], d1v = lapD[fi];
      const frac = (t0 === t1) ? 0 : (cumS2 - t0) / (t1 - t0);
      d2 = d0 + frac * (d1v - d0);
      break;
    }
    prev = fi;
  }
  return (d1 !== null || d2 !== null) ? { s1dist: d1, s2dist: d2 } : null;
}

// ── SVG helpers ──────────────────────────────────────────────────────────────

function niceRange(arr, yFixed, margin = 0.05) {
  if (yFixed) return yFixed;
  let mn = Infinity, mx = -Infinity;
  for (const x of arr) { if (isFinite(x)) { if (x < mn) mn = x; if (x > mx) mx = x; } }
  if (!isFinite(mn)) return [0, 1];
  const span = mx - mn || 1;
  return [mn - span * margin, mx + span * margin];
}

function buildPolylinePts(xs, ys, toX, toY, step = false) {
  const pts = [];
  for (let i = 0; i < xs.length; i++) {
    if (step && i > 0) {
      // Step plot: draw horizontal segment at previous value before stepping down
      pts.push(`${toX(xs[i]).toFixed(1)},${toY(ys[i - 1]).toFixed(1)}`);
    }
    pts.push(`${toX(xs[i]).toFixed(1)},${toY(ys[i]).toFixed(1)}`);
  }
  return pts.join(' ');
}

// ── Circuit map helpers ──────────────────────────────────────────────────────

function computeTrackBounds(trackX, trackZ) {
  let minX = Infinity, maxX = -Infinity, minZ = Infinity, maxZ = -Infinity;
  for (let i = 0; i < trackX.length; i++) {
    const x = trackX[i], z = trackZ[i];
    if (isFinite(x) && isFinite(z)) {
      if (x < minX) minX = x; if (x > maxX) maxX = x;
      if (z < minZ) minZ = z; if (z > maxZ) maxZ = z;
    }
  }
  return { minX, maxX, minZ, maxZ };
}

function buildTrackTransform(bounds) {
  const width = bounds.maxX - bounds.minX || 1;
  const height = bounds.maxZ - bounds.minZ || 1;
  const scale = Math.min((MAP_SIZE - 2 * MAP_PAD) / width, (MAP_SIZE - 2 * MAP_PAD) / height);
  const offsetX = MAP_PAD + (MAP_SIZE - 2 * MAP_PAD - width * scale) / 2;
  const offsetZ = MAP_PAD + (MAP_SIZE - 2 * MAP_PAD - height * scale) / 2;
  return {
    toMapX: (x) => offsetX + (x - bounds.minX) * scale,
    // Invert Z-axis: world Z increases in one direction, SVG Y increases downward
    toMapZ: (z) => offsetZ + (bounds.maxZ - z) * scale,
    bounds, scale, offsetX, offsetZ,
  };
}

function buildTrackPolylinePts(trackX, trackZ, toMapX, toMapZ) {
  const pts = [];
  for (let i = 0; i < trackX.length; i++) {
    if (isFinite(trackX[i]) && isFinite(trackZ[i])) {
      pts.push(`${toMapX(trackX[i]).toFixed(1)},${toMapZ(trackZ[i]).toFixed(1)}`);
    }
  }
  return pts.join(' ');
}

function computeMedianFrameDistanceDelta(distances) {
  if (distances.length < 2) return 0;
  const deltas = [];
  for (let i = 1; i < distances.length; i++) {
    const d = distances[i] - distances[i - 1];
    if (d > 0) deltas.push(d);
  }
  if (!deltas.length) return 0;
  deltas.sort((a, b) => a - b);
  return deltas[Math.floor(deltas.length / 2)];
}

// ── Panel renderer ────────────────────────────────────────────────────────────

function renderPanel(def, bins, maxDist, sectorDists, zoomRange) {
  const H = def.height;
  const plotH = H - PAD.top - PAD.bottom;

  // Collect all values to determine y range
  const allVals = [];
  for (const { key } of Object.values(bins)) {
    if (key) allVals.push(...key.filter(isFinite));
  }
  // bins structure: { session: { col: Float64Array }, ref: { col: Float64Array } }
  // Already computed per channel outside

  const toX = d => {
    const zRange = zoomRange.end - zoomRange.start;
    if (zRange <= 0) return PAD.left;
    const fracD = (d - zoomRange.start) / zRange;
    return PAD.left + fracD * PLOT_W;
  };
  const toY = (s, yMin, yMax) => PAD.top + plotH - ((s - yMin) / (yMax - yMin)) * plotH;

  const distBins = Array.from({ length: maxDist + 1 }, (_, i) => i);

  let svgContent = `<defs><clipPath id="clip-${def.id}"><rect x="${PAD.left}" y="${PAD.top}" width="${PLOT_W}" height="${plotH}"/></clipPath></defs>`;

  // Grid lines and ticks — adjusted for zoom
  const zRange = zoomRange.end - zoomRange.start;
  const distStep = Math.max(100, Math.ceil(zRange / 6 / 100) * 100); // ~6 ticks per panel
  const xTicks = [];
  const startTick = Math.ceil(zoomRange.start / distStep) * distStep;
  for (let d = startTick; d <= zoomRange.end; d += distStep) xTicks.push(d);
  svgContent += xTicks.map(d =>
    `<line x1="${toX(d)}" y1="${PAD.top}" x2="${toX(d)}" y2="${PAD.top + plotH}" stroke="var(--border)" stroke-width="0.5" stroke-dasharray="3 3"/>`
  ).join('');

  // Axes
  svgContent += `<line x1="${PAD.left}" y1="${PAD.top}" x2="${PAD.left}" y2="${PAD.top + plotH}" stroke="var(--border)" stroke-width="1"/>`;
  svgContent += `<line x1="${PAD.left}" y1="${PAD.top + plotH}" x2="${PAD.left + PLOT_W}" y2="${PAD.top + plotH}" stroke="var(--border)" stroke-width="1"/>`;

  // X tick labels (only on bottom panel — checked by caller adding class)
  if (def.showXLabels) {
    svgContent += xTicks.map(d => {
      const x = toX(d);
      if (x < PAD.left || x > PAD.left + PLOT_W) return '';
      return `<text x="${x}" y="${PAD.top + plotH + 16}" text-anchor="middle" fill="var(--muted)" font-size="9" font-family="monospace">${d >= 1000 ? (d / 1000).toFixed(1) + 'k' : d}</text>`;
    }).join('');
    svgContent += `<text x="${PAD.left + PLOT_W / 2}" y="${H - 2}" text-anchor="middle" fill="var(--muted)" font-size="9" font-family="monospace">Distance (m)</text>`;
  }

  // Render per-channel bins
  for (const ch of def.channels || []) {
    const key = `${ch.trace}_${ch.col}`;
    const binArr = bins[key];
    if (!binArr) continue;

    // Compute y range from this channel's data (and others in same panel)
    const allChVals = [];
    for (const ch2 of def.channels) {
      const k2 = `${ch2.trace}_${ch2.col}`;
      if (bins[k2]) allChVals.push(...bins[k2]);
    }
    const [yMin, yMax] = niceRange(allChVals.filter(isFinite), def.yFixed);
    const toYp = s => toY(s, yMin, yMax);

    // Y ticks (once, same for all channels in panel)
    if (ch === def.channels[0]) {
      const yTicks = [];
      const step = def.yStep;
      const start = Math.ceil(yMin / step) * step;
      for (let y = start; y <= yMax; y += step) yTicks.push(y);
      svgContent += yTicks.map(y =>
        `<text x="${PAD.left - 5}" y="${toYp(y) + 3}" text-anchor="end" fill="var(--muted)" font-size="9" font-family="monospace">${Number.isInteger(y) ? y : y.toFixed(1)}</text>`
      ).join('');
      svgContent += yTicks.map(y =>
        `<line x1="${PAD.left}" y1="${toYp(y)}" x2="${PAD.left + PLOT_W}" y2="${toYp(y)}" stroke="var(--border)" stroke-width="0.4" stroke-dasharray="3 3"/>`
      ).join('');
      if (def.zeroline) {
        svgContent += `<line x1="${PAD.left}" y1="${toYp(0)}" x2="${PAD.left + PLOT_W}" y2="${toYp(0)}" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>`;
      }
      // Store range for cursor tooltip
      def._yMin = yMin; def._yMax = yMax;
    }

    const pts = buildPolylinePts(distBins, Array.from(binArr), toX, toYp, ch.step);
    const strokeDash = ch.dash ? 'stroke-dasharray="6 3"' : '';
    svgContent += `<polyline points="${pts}" fill="none" stroke="${ch.color}" stroke-width="0.9" stroke-linejoin="round" ${strokeDash} clip-path="url(#clip-${def.id})"/>`;
  }

  // Sector markers
  if (sectorDists) {
    for (const [dist, label] of [[sectorDists.s1dist, 'S2'], [sectorDists.s2dist, 'S3']]) {
      if (dist == null || dist < 0 || dist > maxDist) continue;
      const x = toX(dist);
      // Get y range from first channel pair
      const yMin = def._yMin ?? 0, yMax = def._yMax ?? 1;
      svgContent += `<line x1="${x}" y1="${PAD.top}" x2="${x}" y2="${PAD.top + plotH}" stroke="var(--sector-clr)" stroke-width="1" stroke-dasharray="4 4" clip-path="url(#clip-${def.id})"/>`;
      svgContent += `<text x="${x + 3}" y="${PAD.top + 11}" fill="var(--sector-clr)" font-size="9" font-family="monospace">${label}</text>`;
    }
  }

  return `<svg class="panel-svg" viewBox="0 0 ${SVG_W} ${H}" data-panel-id="${def.id}">${svgContent}</svg>`;
}

// ── Δt panel renderer ─────────────────────────────────────────────────────────

function renderDtPanel(def, dtBins, maxDist, sectorDists, zoomRange) {
  const H = def.height;
  const plotH = H - PAD.top - PAD.bottom;
  const allVals = Array.from(dtBins).filter(isFinite);
  const [yMin, yMax] = niceRange(allVals, def.yFixed);
  def._yMin = yMin; def._yMax = yMax;

  const toX  = d => {
    const zRange = zoomRange.end - zoomRange.start;
    if (zRange <= 0) return PAD.left;
    const fracD = (d - zoomRange.start) / zRange;
    return PAD.left + fracD * PLOT_W;
  };
  const toY  = s => PAD.top + plotH - ((s - yMin) / (yMax - yMin)) * plotH;
  const distBins = Array.from({ length: maxDist + 1 }, (_, i) => i);

  let svg = `<defs><clipPath id="clip-dt"><rect x="${PAD.left}" y="${PAD.top}" width="${PLOT_W}" height="${plotH}"/></clipPath></defs>`;

  const zRange = zoomRange.end - zoomRange.start;
  const distStep = Math.max(100, Math.ceil(zRange / 6 / 100) * 100);
  const xTicks = [];
  const startTick = Math.ceil(zoomRange.start / distStep) * distStep;
  for (let d = startTick; d <= zoomRange.end; d += distStep) xTicks.push(d);
  svg += xTicks.map(d =>
    `<line x1="${toX(d)}" y1="${PAD.top}" x2="${toX(d)}" y2="${PAD.top + plotH}" stroke="var(--border)" stroke-width="0.5" stroke-dasharray="3 3"/>`
  ).join('');
  svg += `<line x1="${PAD.left}" y1="${PAD.top}" x2="${PAD.left}" y2="${PAD.top + plotH}" stroke="var(--border)" stroke-width="1"/>`;
  svg += `<line x1="${PAD.left}" y1="${PAD.top + plotH}" x2="${PAD.left + PLOT_W}" y2="${PAD.top + plotH}" stroke="var(--border)" stroke-width="1"/>`;

  // X labels (this is the last panel)
  svg += xTicks.map(d => {
    const x = toX(d);
    if (x < PAD.left || x > PAD.left + PLOT_W) return '';
    return `<text x="${x}" y="${PAD.top + plotH + 16}" text-anchor="middle" fill="var(--muted)" font-size="9" font-family="monospace">${d >= 1000 ? (d / 1000).toFixed(1) + 'k' : d}</text>`;
  }).join('');
  svg += `<text x="${PAD.left + PLOT_W / 2}" y="${H - 2}" text-anchor="middle" fill="var(--muted)" font-size="9" font-family="monospace">Distance (m)</text>`;

  const yStep = def.yStep;
  const yStart = Math.ceil(yMin / yStep) * yStep;
  const yTicks = [];
  for (let y = yStart; y <= yMax; y += yStep) yTicks.push(y);
  svg += yTicks.map(y =>
    `<text x="${PAD.left - 5}" y="${toY(y) + 3}" text-anchor="end" fill="var(--muted)" font-size="9" font-family="monospace">${y > 0 ? '+' : ''}${y}</text>`
  ).join('');
  svg += yTicks.map(y =>
    `<line x1="${PAD.left}" y1="${toY(y)}" x2="${PAD.left + PLOT_W}" y2="${toY(y)}" stroke="var(--border)" stroke-width="0.4" stroke-dasharray="3 3"/>`
  ).join('');
  // Reference lap baseline at y=0 (orange dashed, same style as other panels)
  const zeroY = toY(Math.max(yMin, Math.min(yMax, 0)));
  svg += `<polyline points="${PAD.left},${zeroY} ${PAD.left + PLOT_W},${zeroY}" fill="none" stroke="var(--ref)" stroke-width="0.9" stroke-dasharray="6 3" clip-path="url(#clip-dt)"/>`;

  // Δt polyline — session delta vs reference (blue solid)
  const pts = Array.from(dtBins, (v, i) => `${toX(i).toFixed(1)},${toY(v).toFixed(1)}`).join(' ');
  svg += `<polyline points="${pts}" fill="none" stroke="var(--session)" stroke-width="0.9" stroke-linejoin="round" clip-path="url(#clip-dt)"/>`;

  // Sector markers + per-sector Δt readouts (cumulative Δt at each boundary,
  // plus the lap-end value pinned to the right edge).
  const dtAt = (dist) => {
    if (dist == null || dist < 0 || dist > maxDist) return null;
    const i = Math.max(0, Math.min(Math.round(dist), dtBins.length - 1));
    return dtBins[i];
  };
  const fmtMs = v => `${v >= 0 ? '+' : ''}${v.toFixed(0)} ms`;
  const dtColor = v => v > 5 ? 'var(--dt-pos)' : v < -5 ? 'var(--dt-neg)' : 'var(--muted)';

  if (sectorDists) {
    for (const [dist, label] of [[sectorDists.s1dist, 'S2'], [sectorDists.s2dist, 'S3']]) {
      if (dist == null || dist < 0 || dist > maxDist) continue;
      const x = toX(dist);
      svg += `<line x1="${x}" y1="${PAD.top}" x2="${x}" y2="${PAD.top + plotH}" stroke="var(--sector-clr)" stroke-width="1" stroke-dasharray="4 4" clip-path="url(#clip-dt)"/>`;
      svg += `<text x="${x + 3}" y="${PAD.top + 11}" fill="var(--sector-clr)" font-size="9" font-family="monospace">${label}</text>`;
      const v = dtAt(dist);
      if (v != null && isFinite(v)) {
        svg += `<text x="${x + 3}" y="${PAD.top + 22}" fill="${dtColor(v)}" font-size="9" font-family="monospace" font-weight="600">${fmtMs(v)}</text>`;
      }
    }
  }
  // Lap-end Δt readout pinned to the right of the plot.
  const lastDt = dtBins[dtBins.length - 1];
  if (isFinite(lastDt)) {
    svg += `<text x="${PAD.left + PLOT_W - 4}" y="${PAD.top + 11}" text-anchor="end" fill="${dtColor(lastDt)}" font-size="10" font-family="monospace" font-weight="600">end ${fmtMs(lastDt)}</text>`;
  }

  return `<svg class="panel-svg" viewBox="0 0 ${SVG_W} ${H}" data-panel-id="dt">${svg}</svg>`;
}

// ── Main render ───────────────────────────────────────────────────────────────

let currentSessionBins = null; // { col: Float64Array }
let currentRefBins     = null;
let currentMaxDist     = 0;
let currentDtBins      = null;
let currentTrackX      = null; // Resampled track coordinates
let currentTrackZ      = null;
let currentZoomRange   = null; // { start, end }
let trackTransform     = null;

// ── Persistent zoom (M6) ────────────────────────────────────────────────────
const ZOOM_LS_KEY = 'lap-telemetry.zoom.v1';

function persistZoom(zoom) {
  try {
    if (zoom.start === 0 && zoom.end >= currentMaxDist) {
      localStorage.removeItem(ZOOM_LS_KEY);  // full-range = no persisted state
    } else {
      localStorage.setItem(ZOOM_LS_KEY, JSON.stringify({ start: zoom.start, end: zoom.end }));
    }
  } catch { /* localStorage unavailable */ }
}

function loadPersistedZoom(maxDist) {
  try {
    const raw = localStorage.getItem(ZOOM_LS_KEY);
    if (!raw) return null;
    const z = JSON.parse(raw);
    if (typeof z.start !== 'number' || typeof z.end !== 'number') return null;
    if (z.start < 0 || z.end > maxDist || z.end - z.start < 10) return null;  // out of range / nonsense
    return { start: z.start, end: z.end };
  } catch { return null; }
}

// Heatmap colour ramps: each takes a normalised v in [0,1] and returns a CSS colour.
const HEATMAP_RAMPS = {
  // speed: cool (slow) → warm (fast). HSL hue 220 (blue) → 0 (red), high saturation.
  speed:    v => `hsl(${(220 - 220 * v).toFixed(0)}, 85%, 55%)`,
  // brake: faint grey (no brake) → bright red (full brake).
  brake:    v => `rgba(244, 67, 54, ${(0.15 + 0.85 * v).toFixed(2)})`,
  // throttle: faint grey (off) → bright green (full).
  throttle: v => `rgba(76, 175, 80, ${(0.15 + 0.85 * v).toFixed(2)})`,
};
const HEATMAP_CHANNELS = { speed: 'speed_kph', brake: 'brake_norm', throttle: 'throttle_norm' };

let currentMapMode = 'outline';

function renderCircuitMap() {
  if (!currentTrackX || !currentTrackZ) return;

  const trackOutline = document.getElementById('track-outline');
  const segGroup = document.getElementById('track-segments');
  const mapPanel = document.getElementById('circuit-map-panel');
  if (!trackOutline) return;

  const bounds = computeTrackBounds(Array.from(currentTrackX), Array.from(currentTrackZ));
  trackTransform = buildTrackTransform(bounds);
  const pts = buildTrackPolylinePts(Array.from(currentTrackX), Array.from(currentTrackZ), trackTransform.toMapX, trackTransform.toMapZ);

  if (currentMapMode === 'outline') {
    trackOutline.setAttribute('points', pts);
    trackOutline.style.display = '';
    segGroup.innerHTML = '';
  } else {
    // Heatmap: draw per-bin coloured segments instead of the single polyline.
    trackOutline.style.display = 'none';
    segGroup.innerHTML = renderHeatmapSegments(currentMapMode);
  }

  renderMapLegend();
  mapPanel.style.display = 'block';
  updateZoomArc();
}

function renderHeatmapSegments(mode) {
  const col = HEATMAP_CHANNELS[mode];
  const bins = currentSessionBins?.[col];
  if (!bins) return '';
  // Range for normalisation: brake/throttle are [0,1]; speed uses session min/max.
  let lo = 0, hi = 1;
  if (mode === 'speed') {
    lo = Infinity; hi = -Infinity;
    for (const v of bins) { if (isFinite(v)) { if (v < lo) lo = v; if (v > hi) hi = v; } }
    if (!isFinite(lo) || hi <= lo) { lo = 0; hi = 1; }
  }
  const ramp = HEATMAP_RAMPS[mode];
  const out = [];
  // 2 m chunks keep the SVG count low (~2.3 k segments for a 4.6 km lap) while still smooth.
  const STEP = 2;
  for (let i = 0; i + STEP < currentTrackX.length; i += STEP) {
    const x1 = currentTrackX[i], z1 = currentTrackZ[i];
    const x2 = currentTrackX[i + STEP], z2 = currentTrackZ[i + STEP];
    if (!isFinite(x1) || !isFinite(z1) || !isFinite(x2) || !isFinite(z2)) continue;
    const v = bins[i + Math.floor(STEP / 2)];
    if (!isFinite(v)) continue;
    const norm = Math.max(0, Math.min(1, (v - lo) / (hi - lo || 1)));
    const colour = ramp(norm);
    const X1 = trackTransform.toMapX(x1).toFixed(1);
    const Y1 = trackTransform.toMapZ(z1).toFixed(1);
    const X2 = trackTransform.toMapX(x2).toFixed(1);
    const Y2 = trackTransform.toMapZ(z2).toFixed(1);
    out.push(`<line x1="${X1}" y1="${Y1}" x2="${X2}" y2="${Y2}" stroke="${colour}" stroke-width="2.5" stroke-linecap="round"/>`);
  }
  return out.join('');
}

function renderMapLegend() {
  const el = document.getElementById('map-legend');
  if (!el) return;
  if (currentMapMode === 'outline') { el.innerHTML = ''; return; }
  const col = HEATMAP_CHANNELS[currentMapMode];
  const bins = currentSessionBins?.[col];
  let lo = 0, hi = 1, unit = '';
  if (currentMapMode === 'speed' && bins) {
    lo = Infinity; hi = -Infinity;
    for (const v of bins) { if (isFinite(v)) { if (v < lo) lo = v; if (v > hi) hi = v; } }
    if (!isFinite(lo) || hi <= lo) { lo = 0; hi = 1; }
    unit = ' km/h';
  } else if (currentMapMode === 'brake' || currentMapMode === 'throttle') {
    lo = 0; hi = 1; unit = '';
  }
  const ramp = HEATMAP_RAMPS[currentMapMode];
  const stops = [];
  for (let i = 0; i <= 10; i++) stops.push(`${ramp(i / 10)} ${i * 10}%`);
  const fmt = currentMapMode === 'speed' ? v => v.toFixed(0) : v => v.toFixed(1);
  el.innerHTML = `<span>${fmt(lo)}${unit}</span><div class="map-legend-bar" style="background:linear-gradient(to right, ${stops.join(',')})"></div><span>${fmt(hi)}${unit}</span>`;
}

function updateZoomArc() {
  const zoomArc = document.getElementById('zoom-arc');
  if (!currentTrackX || !currentTrackZ || !trackTransform || !currentZoomRange) {
    if (zoomArc) zoomArc.style.display = 'none';
    return;
  }

  const isZoomed = currentZoomRange.start > 0 || currentZoomRange.end < currentMaxDist;
  if (!isZoomed) {
    zoomArc.style.display = 'none';
    return;
  }

  const startIdx = Math.max(0, Math.floor(currentZoomRange.start));
  const endIdx = Math.min(currentMaxDist, Math.ceil(currentZoomRange.end));
  const pts = [];

  for (let i = startIdx; i <= endIdx && i < currentTrackX.length; i++) {
    if (isFinite(currentTrackX[i]) && isFinite(currentTrackZ[i])) {
      pts.push(`${trackTransform.toMapX(currentTrackX[i]).toFixed(1)},${trackTransform.toMapZ(currentTrackZ[i]).toFixed(1)}`);
    }
  }

  if (pts.length > 0) {
    zoomArc.setAttribute('points', pts.join(' '));
    zoomArc.style.display = 'block';
  } else {
    zoomArc.style.display = 'none';
  }
}

function renderAll(sessionEntry, sessionSegIdx, refEntry, refSegIdx) {
  const sSeg = sessionEntry.segments[sessionSegIdx];
  const rSeg = refEntry.segments[refSegIdx];

  const sDistRaw  = sessionEntry.data.lap_distance_m.slice(sSeg.start, sSeg.end);
  const rDistRaw  = refEntry.data.lap_distance_m.slice(rSeg.start, rSeg.end);
  const sMaxDist  = Math.ceil(Math.max(...sDistRaw));
  const rMaxDist  = Math.ceil(Math.max(...rDistRaw));
  const maxDist   = Math.max(sMaxDist, rMaxDist);

  currentMaxDist = maxDist;
  currentSessionBins = {};
  currentRefBins = {};
  // Restore persisted zoom (M6) on first render; preserve across re-renders.
  if (!currentZoomRange) {
    currentZoomRange = loadPersistedZoom(maxDist) || { start: 0, end: maxDist };
  } else {
    currentZoomRange.end = Math.min(currentZoomRange.end, maxDist);
  }

  // Resample all channels
  for (const def of PANEL_DEFS) {
    if (!def.channels) continue;
    for (const ch of def.channels) {
      const entry = ch.trace === 'session' ? sessionEntry : refEntry;
      const seg   = ch.trace === 'session' ? sSeg : rSeg;
      const raw   = entry.data[ch.col];
      if (!raw || raw.length === 0) {
        const bins = new Float64Array(maxDist + 1);
        if (ch.trace === 'session') currentSessionBins[ch.col] = bins;
        else                        currentRefBins[ch.col]     = bins;
        continue;
      }
      const distSlice = ch.trace === 'session'
        ? sDistRaw : refEntry.data.lap_distance_m.slice(rSeg.start, rSeg.end);
      const valSlice  = raw.slice(seg.start, seg.end);
      const bins      = resample(Array.from(distSlice), Array.from(valSlice), maxDist);
      if (ch.trace === 'session') currentSessionBins[ch.col] = bins;
      else                        currentRefBins[ch.col]     = bins;
    }
  }

  // Resample track coordinates (F1)
  if (sessionEntry.data.pos_x_m && sessionEntry.data.pos_z_m) {
    const sTrackX = resample(Array.from(sDistRaw), Array.from(sessionEntry.data.pos_x_m.slice(sSeg.start, sSeg.end)), maxDist);
    const sTrackZ = resample(Array.from(sDistRaw), Array.from(sessionEntry.data.pos_z_m.slice(sSeg.start, sSeg.end)), maxDist);
    currentTrackX = sTrackX;
    currentTrackZ = sTrackZ;
  }

  // Δt
  const sBinsSpeed = currentSessionBins['speed_kph'] || new Float64Array(maxDist + 1);
  const rBinsSpeed = currentRefBins['speed_kph']     || new Float64Array(maxDist + 1);
  currentDtBins = computeDeltaT(sBinsSpeed, rBinsSpeed);

  // Coarse-data warning (Fix 4)
  const medianDelta = computeMedianFrameDistanceDelta(Array.from(sDistRaw));
  const coarseDataWarning = medianDelta > 2;

  // Sector markers from session lap
  const sectorDists = deriveSectorDistances(sessionEntry, sessionSegIdx);

  // Build all panel HTML
  const panelsDiv = document.getElementById('panels');
  panelsDiv.innerHTML = '';

  const hasSlip = sessionEntry.hasSlip || refEntry.hasSlip;
  const lastIdx = PANEL_DEFS.length - 1;
  for (let pi = 0; pi < PANEL_DEFS.length; pi++) {
    const def = PANEL_DEFS[pi];
    const wrap = document.createElement('div');
    wrap.className = 'panel-wrap';

    const labelEl = document.createElement('div');
    labelEl.className = 'panel-label';
    let labelText = def.label;

    // Add coarse-data warning to Δt panel label
    if (def.id === 'dt' && coarseDataWarning) {
      labelText += ' ⚠ legacy distance resolution';
    }

    labelEl.textContent = labelText;
    wrap.appendChild(labelEl);

    // Skip slip panel with a placeholder when neither lap has slip data
    // (old recordings pre-date the slip angle columns in the schema).
    if (def.id === 'slip' && !hasSlip) {
      const note = document.createElement('div');
      note.style.cssText = `height:32px;line-height:32px;color:var(--muted);font-size:11px;padding-left:${PAD.left}px`;
      note.textContent = 'no slip angle data — requires a new recording';
      wrap.appendChild(note);
      panelsDiv.appendChild(wrap);
      continue;
    }

    let svgHtml;
    if (def.id === 'dt') {
      def.showXLabels = true;
      svgHtml = renderDtPanel(def, currentDtBins, maxDist, sectorDists, currentZoomRange);
    } else {
      def.showXLabels = (pi === lastIdx - 1); // second-to-last non-dt panel
      // Build bins map
      const binsMap = {};
      for (const ch of def.channels) {
        const srcBins = ch.trace === 'session' ? currentSessionBins : currentRefBins;
        binsMap[`${ch.trace}_${ch.col}`] = srcBins[ch.col];
      }
      svgHtml = renderPanel(def, binsMap, maxDist, sectorDists, currentZoomRange);
    }

    wrap.insertAdjacentHTML('beforeend', svgHtml);
    panelsDiv.appendChild(wrap);
  }

  document.getElementById('placeholder').style.display = 'none';

  // Update legend
  const sl = formatPickLabel(sessionEntry, sessionSegIdx);
  const rl = formatPickLabel(refEntry, refSegIdx);
  document.getElementById('legend-session').textContent = sl;
  document.getElementById('legend-ref').textContent     = rl;
  document.getElementById('legend').classList.add('visible');

  // Render circuit map (F1)
  renderCircuitMap();

  // Reset cursor and zoom state
  state.maxDist = maxDist;
}

// ── Picker population ─────────────────────────────────────────────────────────

function formatDuration(s) {
  const m = Math.floor(s / 60);
  const ss = (s % 60).toFixed(3).padStart(6, '0');
  return `${m}:${ss}`;
}

function formatPickLabel(entry, segIdx) {
  const seg = entry.segments[segIdx];
  const lapTimes = entry.data.lap_time_s;
  const sliceTimes = lapTimes.slice(seg.start, seg.end);
  const dur = sliceTimes.length ? Math.max(...sliceTimes) : 0;
  const total = entry.segments.length;
  const mark = segIdx === 0 ? '(out)' : segIdx === total - 1 ? '(in)' : formatDuration(dur);
  const sc = entry.sidecar;
  const meta = sc
    ? ` · ${shortVehicle(sc.vehicle_name)}${sc.setup_file_guess ? ` · ${shortSetup(sc.setup_file_guess)}` : ''}`
    : '';
  return `${entry.fileName} / Lap ${segIdx + 1} #${seg.lapNum} ${mark}${meta}`;
}

function rebuildPickers() {
  const sessionPicker = document.getElementById('session-picker');
  const refPicker     = document.getElementById('ref-picker');
  const prevSession   = sessionPicker.value;
  const prevRef       = refPicker.value;

  const optHtml = [];
  let hasOptions = false;
  for (const [key, entry] of store) {
    const total = entry.segments.length;
    let bestTime = Infinity, bestIdx = -1;
    for (let i = 1; i < total - 1; i++) {
      const seg = entry.segments[i];
      const sliceTimes = entry.data.lap_time_s.slice(seg.start, seg.end);
      const dur = sliceTimes.length ? Math.max(...sliceTimes) : 0;
      if (dur > 0 && dur < bestTime) { bestTime = dur; bestIdx = i; }
    }

    const sc = entry.sidecar;
    const groupMeta = sc
      ? ` — ${shortVehicle(sc.vehicle_name)}${sc.setup_file_guess ? ` (${shortSetup(sc.setup_file_guess)})` : ''}`
      : '';
    const groupLabel = `${entry.fileName}${groupMeta}`;
    let groupHtml = `<optgroup label="${groupLabel}">`;
    for (let i = 0; i < total; i++) {
      const seg = entry.segments[i];
      const lapTimes = entry.data.lap_time_s;
      const sliceTimes = lapTimes.slice(seg.start, seg.end);
      const dur = sliceTimes.length ? Math.max(...sliceTimes) : 0;

      let label = `  Lap ${i + 1}  (lap# ${seg.lapNum})`;
      if (i === 0) label += '  (out lap)';
      else if (i === total - 1) label += '  (in lap)';
      else label += `  ${formatDuration(dur)}`;
      if (i === bestIdx) label += '  ★';

      const valStr = `${key}::${i}`;
      groupHtml += `<option value="${valStr}">${label}</option>`;
      hasOptions = true;
    }
    groupHtml += '</optgroup>';
    optHtml.push(groupHtml);
  }

  const placeholder = '<option value="">— load a session file —</option>';
  const inner = hasOptions ? optHtml.join('') : placeholder;
  sessionPicker.innerHTML = inner;
  refPicker.innerHTML     = inner;

  if (hasOptions) {
    sessionPicker.disabled = false;
    refPicker.disabled     = false;
    // Restore previous selection if still valid
    if (prevSession && sessionPicker.querySelector(`option[value="${prevSession}"]`))
      sessionPicker.value = prevSession;
    if (prevRef && refPicker.querySelector(`option[value="${prevRef}"]`))
      refPicker.value = prevRef;
  } else {
    sessionPicker.disabled = true;
    refPicker.disabled     = true;
  }
  updateCompareBtn();
}

function updateCompareBtn() {
  const sp = document.getElementById('session-picker');
  const rp = document.getElementById('ref-picker');
  document.getElementById('compare-btn').disabled = !sp.value || !rp.value;
}

function parsePickerValue(val) {
  if (!val) return null;
  const lastSep = val.lastIndexOf('::');
  if (lastSep < 0) return null;
  const key    = val.slice(0, lastSep);
  const segIdx = parseInt(val.slice(lastSep + 2), 10);
  return { key, segIdx };
}

// ── File loading ──────────────────────────────────────────────────────────────

// Pending sidecar JSONs keyed by stem (filename without extension).
// When the parquet for the same stem arrives, we attach the metadata.
const pendingSidecars = new Map();  // stem → sidecar object

function fileStem(name) {
  const i = name.lastIndexOf('.');
  return i > 0 ? name.slice(0, i) : name;
}

async function loadSidecar(file) {
  try {
    const text = await file.text();
    const sidecar = JSON.parse(text);
    const stem = fileStem(file.name);
    // If parquet already loaded for this stem, attach now.
    let attached = false;
    for (const [key, entry] of store) {
      if (fileStem(entry.fileName) === stem) {
        entry.sidecar = sidecar;
        attached = true;
        break;
      }
    }
    if (!attached) pendingSidecars.set(stem, sidecar);
    rebuildPickers();
    refreshSessionListBadges();
  } catch (e) {
    console.warn(`sidecar parse failed for ${file.name}: ${e.message}`);
  }
}

async function loadFile(file) {
  if (file.name.toLowerCase().endsWith('.json')) {
    return loadSidecar(file);
  }
  const key = storeKey(file);
  if (store.has(key)) return; // already loaded

  const badge = addSessionEntry(file.name, key, 'loading…');
  setBadge(badge, 'loading', 'loading…');

  try {
    const { data, missingCols } = await readColumns(file, COLUMNS);
    const segments = buildSegments(data.lap_number);

    const hasSlip    = data.slip_angle_fl_deg.length > 0;
    const hasSectors = data.last_sector_1_s.length > 0;

    // If a sidecar for this parquet was loaded earlier, attach it now.
    const stem = fileStem(file.name);
    const sidecar = pendingSidecars.get(stem) || null;
    if (sidecar) pendingSidecars.delete(stem);

    store.set(key, {
      fileName: file.name,
      data,
      segments,
      hasSlip,
      hasSectors,
      sidecar,
    });

    const missing = missingCols.filter(c => c !== 'last_sector_1_s' && c !== 'last_sector_2_s' && c !== 'slip_angle_fl_deg' && c !== 'slip_angle_fr_deg');
    const metaSuffix = sidecar ? ` · ${shortVehicle(sidecar.vehicle_name)}` : '';
    if (missing.length) {
      setBadge(badge, 'ok', `${data.lap_number.length} rows · ${segments.length} laps${metaSuffix} (⚠ missing: ${missing.join(',')})`);
    } else {
      setBadge(badge, 'ok', `${data.lap_number.length} rows · ${segments.length} laps${metaSuffix}`);
    }

    rebuildPickers();
    document.getElementById('load-status').textContent = `${store.size} file(s) loaded`;
    document.getElementById('load-status').className = 'badge ok';
  } catch (e) {
    setBadge(badge, 'err', `error: ${e.message.slice(0, 60)}`);
    console.error('load error', e);
    showError(`Failed to load ${file.name}: ${e.message}`);
  }
}

function shortVehicle(name) {
  if (!name) return 'unknown vehicle';
  // "WTM by Rinaldi Racing 2025 #12:ELMS" → "WTM #12:ELMS" (keep distinguishing parts)
  const colon = name.indexOf(':');
  const tail = colon >= 0 ? name.slice(colon) : '';
  const head = (colon >= 0 ? name.slice(0, colon) : name).trim();
  // Take first word + any "#N" token
  const m = head.match(/^(\S+).*?(\#\d+)?\s*$/);
  return ((m && m[1]) || head.slice(0, 20)) + (m && m[2] ? ` ${m[2]}` : '') + tail;
}

function shortSetup(name) {
  if (!name) return null;
  return name.replace(/\.svm$/i, '');
}

function refreshSessionListBadges() {
  for (const [key, entry] of store) {
    const badge = document.getElementById(`badge-${CSS.escape(key)}`);
    if (!badge) continue;
    const meta = entry.sidecar ? ` · ${shortVehicle(entry.sidecar.vehicle_name)}` : '';
    const text = `${entry.data.lap_number.length} rows · ${entry.segments.length} laps${meta}`;
    setBadge(badge, 'ok', text);
  }
}

// ── Session list UI ───────────────────────────────────────────────────────────

function addSessionEntry(name, key, statusText) {
  const list = document.getElementById('session-list');
  const entry = document.createElement('div');
  entry.className = 'session-entry';
  entry.dataset.key = key;
  entry.innerHTML = `
    <span class="fname" title="${name}">${name}</span>
    <span class="badge loading" id="badge-${CSS.escape(key)}">${statusText}</span>
    <button class="remove-btn" title="Remove" aria-label="Remove">×</button>
  `;
  entry.querySelector('.remove-btn').addEventListener('click', () => {
    store.delete(key);
    entry.remove();
    rebuildPickers();
    const count = store.size;
    const ls = document.getElementById('load-status');
    ls.textContent = count ? `${count} file(s) loaded` : 'no files loaded';
    ls.className = count ? 'badge ok' : 'badge';
  });
  list.appendChild(entry);
  return document.getElementById(`badge-${CSS.escape(key)}`);
}

function setBadge(el, cls, text) {
  el.className = 'badge' + (cls ? ` ${cls}` : '');
  el.textContent = text;
}

// ── Cursor and tooltip ────────────────────────────────────────────────────────

const state = { maxDist: 0, dragging: false, dragStartX: 0, dragStartDist: 0 };

const plotArea     = document.getElementById('plot-area');
const cursorLine   = document.getElementById('cursor-line');
const tooltip      = document.getElementById('tooltip');

function updateCursorPosition(e) {
  if (!currentSessionBins) return;
  const rect = plotArea.getBoundingClientRect();
  const mx   = e.clientX - rect.left;

  // Find the SVG plot left edge (PAD.left px into each SVG)
  // SVGs are sized by viewBox=900, but rendered at 100% width of the container
  const firstSvg = plotArea.querySelector('.panel-svg');
  if (!firstSvg) return;
  const svgRect    = firstSvg.getBoundingClientRect();
  const svgLeft    = svgRect.left - rect.left;
  const svgWidth   = svgRect.width;
  const plotLeft   = svgLeft + PAD.left * (svgWidth / SVG_W);
  const plotRight  = svgLeft + (PAD.left + PLOT_W) * (svgWidth / SVG_W);

  if (mx < plotLeft || mx > plotRight) {
    cursorLine.style.transform = 'translateX(-9999px)';
    tooltip.style.display = 'none';
    updateCursorDot(null);
    return;
  }

  cursorLine.style.transform = `translateX(${mx}px)`;

  const zRange = currentZoomRange.end - currentZoomRange.start;
  const fracX  = (mx - plotLeft) / (plotRight - plotLeft);
  const dist   = currentZoomRange.start + fracX * zRange;
  const binIdx = Math.max(0, Math.min(Math.round(dist), state.maxDist));

  // Update cursor dot on circuit map
  updateCursorDot(binIdx);

  // Tooltip
  const sSpeed  = currentSessionBins.speed_kph?.[binIdx];
  const rSpeed  = currentRefBins.speed_kph?.[binIdx];
  const sDt     = currentDtBins?.[binIdx];
  const sThrottle = currentSessionBins.throttle_norm?.[binIdx];
  const sBrake    = currentSessionBins.brake_norm?.[binIdx];

  const lines = [
    `dist: ${binIdx} m`,
    sSpeed != null ? `speed: ${sSpeed.toFixed(1)} / ${rSpeed?.toFixed(1) ?? '—'} km/h` : '',
    sThrottle != null ? `thr:   ${(sThrottle * 100).toFixed(0)}%   brk: ${((sBrake ?? 0) * 100).toFixed(0)}%` : '',
    sDt != null ? `Δt:   ${sDt > 0 ? '+' : ''}${sDt.toFixed(0)} ms` : '',
  ].filter(Boolean);

  tooltip.textContent = lines.join('\n');
  tooltip.style.display = 'block';
  const tx = Math.min(mx + 14, rect.width - 180);
  // Fix 3: Tooltip Y position follows cursor vertically, clamped inside plot-area
  const ty = Math.max(8, Math.min(e.clientY - rect.top - 30, rect.height - 130));
  tooltip.style.left = `${tx}px`;
  tooltip.style.top  = `${ty}px`;
}

function updateCursorDot(binIdx) {
  const cursorDot = document.getElementById('cursor-dot');
  if (!cursorDot || !currentTrackX || !currentTrackZ || !trackTransform) {
    if (cursorDot) cursorDot.style.display = 'none';
    return;
  }

  if (binIdx === null || !isFinite(currentTrackX[binIdx]) || !isFinite(currentTrackZ[binIdx])) {
    cursorDot.style.display = 'none';
    return;
  }

  const mapX = trackTransform.toMapX(currentTrackX[binIdx]);
  const mapZ = trackTransform.toMapZ(currentTrackZ[binIdx]);
  cursorDot.setAttribute('cx', mapX.toFixed(1));
  cursorDot.setAttribute('cy', mapZ.toFixed(1));
  cursorDot.style.display = 'block';
}

// F2: Zoom interaction handlers
plotArea.addEventListener('mousedown', e => {
  if (!currentSessionBins || !currentZoomRange) return;
  const rect = plotArea.getBoundingClientRect();
  const mx   = e.clientX - rect.left;

  const firstSvg = plotArea.querySelector('.panel-svg');
  if (!firstSvg) return;
  const svgRect    = firstSvg.getBoundingClientRect();
  const svgLeft    = svgRect.left - rect.left;
  const svgWidth   = svgRect.width;
  const plotLeft   = svgLeft + PAD.left * (svgWidth / SVG_W);
  const plotRight  = svgLeft + (PAD.left + PLOT_W) * (svgWidth / SVG_W);

  if (mx < plotLeft || mx > plotRight) return;

  state.dragging = true;
  state.dragStartX = mx;
  const zRange = currentZoomRange.end - currentZoomRange.start;
  const fracX  = (mx - plotLeft) / (plotRight - plotLeft);
  state.dragStartDist = currentZoomRange.start + fracX * zRange;
});

plotArea.addEventListener('mousemove', e => {
  if (state.dragging && currentSessionBins && currentZoomRange) {
    const rect = plotArea.getBoundingClientRect();
    const mx   = e.clientX - rect.left;

    const firstSvg = plotArea.querySelector('.panel-svg');
    if (!firstSvg) {
      updateCursorPosition(e);
      return;
    }

    const svgRect    = firstSvg.getBoundingClientRect();
    const svgLeft    = svgRect.left - rect.left;
    const svgWidth   = svgRect.width;
    const plotLeft   = svgLeft + PAD.left * (svgWidth / SVG_W);
    const plotRight  = svgLeft + (PAD.left + PLOT_W) * (svgWidth / SVG_W);

    // Update selection rect
    const selRect = document.getElementById('zoom-selection-rect');
    const x1 = Math.max(plotLeft, Math.min(state.dragStartX, mx));
    const x2 = Math.max(plotLeft, Math.min(Math.max(state.dragStartX, mx), plotRight));
    selRect.style.left = `${x1}px`;
    selRect.style.width = `${x2 - x1}px`;
    selRect.classList.add('active');
  } else {
    updateCursorPosition(e);
  }
});

plotArea.addEventListener('mouseup', e => {
  if (!state.dragging) return;
  state.dragging = false;

  const selRect = document.getElementById('zoom-selection-rect');
  selRect.classList.remove('active');
  selRect.style.left = '0';
  selRect.style.width = '0';

  if (!currentSessionBins || !currentZoomRange) return;

  const rect = plotArea.getBoundingClientRect();
  const mx   = e.clientX - rect.left;

  const firstSvg = plotArea.querySelector('.panel-svg');
  if (!firstSvg) return;

  const svgRect    = firstSvg.getBoundingClientRect();
  const svgLeft    = svgRect.left - rect.left;
  const svgWidth   = svgRect.width;
  const plotLeft   = svgLeft + PAD.left * (svgWidth / SVG_W);
  const plotRight  = svgLeft + (PAD.left + PLOT_W) * (svgWidth / SVG_W);

  const zRange = currentZoomRange.end - currentZoomRange.start;
  const fracX  = (mx - plotLeft) / (plotRight - plotLeft);
  const dist2  = currentZoomRange.start + fracX * zRange;

  const d1 = Math.max(0, Math.min(state.dragStartDist, dist2));
  const d2 = Math.min(state.maxDist, Math.max(state.dragStartDist, dist2));

  if (d2 - d1 > 10) {  // Only zoom if selection is large enough
    currentZoomRange.start = d1;
    currentZoomRange.end = d2;
    persistZoom(currentZoomRange);
    renderAll(...state.currentRenderParams);
  }
});

plotArea.addEventListener('dblclick', e => {
  // F2: Reset zoom on double-click
  if (!currentSessionBins || !currentZoomRange) return;
  currentZoomRange.start = 0;
  currentZoomRange.end = state.maxDist;
  persistZoom(currentZoomRange);
  renderAll(...state.currentRenderParams);
});

plotArea.addEventListener('mouseleave', () => {
  if (!state.dragging) {
    cursorLine.style.transform = 'translateX(-9999px)';
    tooltip.style.display = 'none';
    updateCursorDot(null);
  }
});

// F2: Keyboard shortcut for reset zoom
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && currentSessionBins && currentZoomRange) {
    currentZoomRange.start = 0;
    currentZoomRange.end = state.maxDist;
    persistZoom(currentZoomRange);
    renderAll(...state.currentRenderParams);
  }
});

// ── Error helper ──────────────────────────────────────────────────────────────
function showError(msg) {
  const el = document.getElementById('error-msg');
  el.textContent = msg;
  el.classList.add('visible');
}
function clearError() {
  document.getElementById('error-msg').classList.remove('visible');
}

// ── Event wiring ──────────────────────────────────────────────────────────────

document.getElementById('load-btn').addEventListener('click', () => {
  document.getElementById('file-input').click();
});

document.getElementById('file-input').addEventListener('change', async e => {
  clearError();
  const files = Array.from(e.target.files || []);
  await Promise.all(files.map(loadFile));
  e.target.value = '';
});

document.getElementById('compare-btn').addEventListener('click', () => {
  clearError();
  const sp = parsePickerValue(document.getElementById('session-picker').value);
  const rp = parsePickerValue(document.getElementById('ref-picker').value);
  if (!sp || !rp) return;

  const sEntry = store.get(sp.key);
  const rEntry = store.get(rp.key);
  if (!sEntry || !rEntry) return;

  state.currentRenderParams = [sEntry, sp.segIdx, rEntry, rp.segIdx];
  renderAll(sEntry, sp.segIdx, rEntry, rp.segIdx);
});

// Auto-compare on picker change if both are selected
['session-picker', 'ref-picker'].forEach(id => {
  document.getElementById(id).addEventListener('change', () => {
    updateCompareBtn();
    const sp = parsePickerValue(document.getElementById('session-picker').value);
    const rp = parsePickerValue(document.getElementById('ref-picker').value);
    if (sp && rp) {
      const sEntry = store.get(sp.key);
      const rEntry = store.get(rp.key);
      if (sEntry && rEntry) {
        state.currentRenderParams = [sEntry, sp.segIdx, rEntry, rp.segIdx];
        renderAll(sEntry, sp.segIdx, rEntry, rp.segIdx);
      }
    }
  });
});

// Heatmap mode change re-renders the circuit map only (no panel re-render needed).
document.getElementById('map-mode').addEventListener('change', e => {
  currentMapMode = e.target.value;
  if (currentSessionBins) renderCircuitMap();
});

// ── Debug hooks for Playwright ────────────────────────────────────────────────

window.__getSessionKeys = () => [...store.keys()];

window.__resamplerDebug = function(storeKeyStr, segIdx) {
  const entry = store.get(storeKeyStr);
  if (!entry) throw new Error(`store key not found: ${storeKeyStr}`);
  const seg    = entry.segments[segIdx];
  const dists  = Array.from(entry.data.lap_distance_m.slice(seg.start, seg.end));
  const speeds = Array.from(entry.data.speed_kph.slice(seg.start, seg.end));
  const maxD   = Math.ceil(Math.max(...dists));
  return Array.from(resample(dists, speeds, maxD));
};

window.__refResamplerDebug = function(storeKeyStr, segIdx) {
  return window.__resamplerDebug(storeKeyStr, segIdx);
};

window.__dtDebug = function(sessionKey, sessionSeg, refKey, refSeg) {
  const se   = store.get(sessionKey);
  const re   = store.get(refKey);
  if (!se || !re) throw new Error('store keys not found');
  const sSeg = se.segments[sessionSeg];
  const rSeg = re.segments[refSeg];
  const maxD = Math.max(
    Math.ceil(Math.max(...se.data.lap_distance_m.slice(sSeg.start, sSeg.end))),
    Math.ceil(Math.max(...re.data.lap_distance_m.slice(rSeg.start, rSeg.end)))
  );
  const sBins = resample(
    Array.from(se.data.lap_distance_m.slice(sSeg.start, sSeg.end)),
    Array.from(se.data.speed_kph.slice(sSeg.start, sSeg.end)), maxD
  );
  const rBins = resample(
    Array.from(re.data.lap_distance_m.slice(rSeg.start, rSeg.end)),
    Array.from(re.data.speed_kph.slice(rSeg.start, rSeg.end)), maxD
  );
  return Array.from(computeDeltaT(sBins, rBins));
};

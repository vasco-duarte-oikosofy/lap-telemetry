# Coach LLM configuration
# API keys are NEVER stored here — only the name of the environment variable.
# Set the actual key in your shell: export ANTHROPIC_API_KEY=sk-...

[llm]
provider = "ollama"
model = "glm-5.1:cloud"
api_key_env = "OLLAMA_API_KEY"              # local Ollama doesn't validate this
temperature = 0.3
max_tokens = 4096
base_url = "http://localhost:11434/v1"